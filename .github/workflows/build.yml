name: Build, verify and release XYRO 1.5
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_BUILD_JOBS: '2'
concurrency:
  group: xyro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Import verified v1.5.2 runtime fixes
        if: hashFiles('source-v1.5.2.zip') != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          EXPECTED_SHA256: 1a56522501fd953e286464bf16ceb4765326c11e46d30e5c32e65b0f6ff119b9
        run: |
          python - <<'PYIMPORT'
          import hashlib, os, pathlib, zipfile
          source=pathlib.Path('source-v1.5.2.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256'], 'Unexpected source archive'
          with zipfile.ZipFile(source) as pack:
              for item in pack.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] not in ('.git','.github'), 'Unsafe archive path'
              pack.extractall('.')
          source.unlink()
          PYIMPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix XYRO 1.5.2 runtime failures and resumable scans [skip ci]'
          git push origin HEAD:main
      - id: source
        name: Record exact source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt PyYAML==6.0.3
      - run: python tools/prepare_templates.py
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-nuclei-templates
          path: engine/data/
          if-no-files-found: error
      - run: python -m unittest discover -s tests -v
      - run: node --check engine/web/app.js
  desktop:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Rust toolchain
        run: rustup update stable
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: bin/
          key: native-v1-${{ runner.os }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - run: python tools/build_native.py
        if: steps.native-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: bin/
          key: native-v1-${{ runner.os }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - uses: actions/download-artifact@v4
        with:
          name: pinned-nuclei-templates
          path: engine/data
      - run: python desktop.py --selftest
      - run: python tools/package_desktop.py
      - name: Test packaged Linux application
        if: runner.os == 'Linux'
        run: ./dist/XYRO/XYRO --selftest
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        run: ./dist/XYRO/XYRO.exe --selftest
      - run: python tools/archive_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
  android-native:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'ndk;28.2.13676358'
      - run: rustup update stable
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          key: native-v1-android-${{ matrix.abi }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - name: Build Android executables
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python tools/build_native.py --android "${{ matrix.abi }}" --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          key: native-v1-android-${{ matrix.abi }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          if-no-files-found: error
  android:
    needs: [engine, android-native]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: native-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: android/app/src/main/jniLibs/x86_64
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: pinned-nuclei-templates
          path: engine/data
      - run: python tools/prepare_android.py
      - run: gradle -p android assembleDebug lintDebug
      - name: Free disk and memory for emulator
        run: |
          gradle --stop
          sudo rm -rf "${ANDROID_HOME:?}/ndk" /usr/share/dotnet
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python tools/check_android.py
      - name: Name APK and calculate checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/XYRO-1.5.2-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-Android
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: |
            test-results/
            android/app/build/reports/
          if-no-files-found: ignore

  release:
    needs: [engine, desktop, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify asset set and checksum
        run: |
          python - <<'PYASSETS'
          from pathlib import Path
          import hashlib
          root=Path('release-assets')
          expected={'XYRO-1.5.2-Android.apk','XYRO-1.5.2-Windows-x64.zip','XYRO-1.5.2-Linux-x64.tar.gz'}
          assert {p.name for p in root.iterdir()}==expected, 'Unexpected or missing release asset'
          lines=[]
          for p in sorted(root.iterdir()):
              assert p.stat().st_size>1000000, 'Truncated release asset'
              lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name)
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PYASSETS
      - name: Publish tested applications
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.engine.outputs.source_sha }}
        run: |
          if gh release view v1.5.2 >/dev/null 2>&1; then
            echo 'v1.5.2 already exists; published assets are preserved.'
          else
            gh release create v1.5.2 --target "$SOURCE_SHA" --title 'XYRO 1.5.2 — исправления инструментов и продолжения' --notes-file docs/release-v1.5.2.md release-assets/*
          fi
