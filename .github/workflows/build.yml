name: Build, verify and release XYRO 2.0
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_BUILD_JOBS: '2'
concurrency:
  group: xyro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Import reviewed XYRO 2.0 source and record revision
        run: |
          if [ -f xyro-v2-source.zip ]; then
            python - <<'PYIMPORT'
          from pathlib import Path
          import hashlib,zipfile
          archive=Path('xyro-v2-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=="3a12e0df8ed53bd7376056f881816ed692dabcc889e6ad35284c723efc41108f", 'Source archive mismatch'
          allowed=['README.md', 'android/app/build.gradle', 'docs/architecture-v2.md', 'docs/release-v2.0.0.md', 'engine/adapters.py', 'engine/authchecks.py', 'engine/builtin.py', 'engine/catalog.py', 'engine/forms.py', 'engine/healthchecks.py', 'engine/model.py', 'engine/nuclei_runner.py', 'engine/osint.py', 'engine/recon.py', 'engine/reports.py', 'engine/server.py', 'engine/templates.py', 'engine/web/app.js', 'engine/web/index.html', 'engine/web/style.css', 'engine/worker.py', 'engine/workflow.py', 'licenses/certifi-CA-LICENSE', 'tests/test_v2.py', 'tools.lock.json', 'tools/archive_desktop.py', 'tools/build_native.py', 'tools/check_android.py', 'tools/patch_native.py', 'tools/patches/ca-bundle.pem', 'tools/patches/dalfox_tls.rs', 'tools/prepare_templates.py']
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())==set(allowed), 'Unexpected archive file'
              for name in allowed:
                  path=Path(name)
                  assert not path.is_absolute() and '..' not in path.parts and not name.startswith('.github/')
              z.extractall('.')
          archive.unlink()
          PYIMPORT
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            git commit -m 'Implement XYRO 2.0 workflow, DAST, TLS and Censys [skip ci]'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt PyYAML==6.0.3
      - run: python tools/prepare_templates.py
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-nuclei-templates
          path: engine/data/
          if-no-files-found: error
      - run: python -m unittest discover -s tests -v
      - run: node --check engine/web/app.js
  desktop:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Rust toolchain
        run: rustup update stable
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: bin/
          key: native-v2-${{ runner.os }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py', 'tools/patch_native.py', 'tools/patches/**') }}
      - run: python tools/build_native.py
        if: steps.native-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: bin/
          key: native-v2-${{ runner.os }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py', 'tools/patch_native.py', 'tools/patches/**') }}
      - uses: actions/download-artifact@v4
        with:
          name: pinned-nuclei-templates
          path: engine/data
      - run: python desktop.py --selftest
      - run: python tools/package_desktop.py
      - name: Test packaged Linux application
        if: runner.os == 'Linux'
        run: ./dist/XYRO/XYRO --selftest
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        run: ./dist/XYRO/XYRO.exe --selftest
      - run: python tools/archive_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
  android-native:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'ndk;28.2.13676358'
      - run: rustup update stable
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          key: native-v2-android-${{ matrix.abi }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py', 'tools/patch_native.py', 'tools/patches/**') }}
      - name: Build Android executables
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python tools/build_native.py --android "${{ matrix.abi }}" --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          key: native-v2-android-${{ matrix.abi }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py', 'tools/patch_native.py', 'tools/patches/**') }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          if-no-files-found: error
  android:
    needs: [engine, android-native]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: native-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: android/app/src/main/jniLibs/x86_64
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: pinned-nuclei-templates
          path: engine/data
      - run: python tools/prepare_android.py
      - run: gradle -p android assembleDebug lintDebug
      - name: Free disk and memory for emulator
        run: |
          gradle --stop
          sudo rm -rf "${ANDROID_HOME:?}/ndk" /usr/share/dotnet
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python tools/check_android.py
      - name: Name APK and calculate checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/XYRO-2.0.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-Android
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: |
            test-results/
            android/app/build/reports/
          if-no-files-found: ignore

  release:
    needs: [engine, desktop, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.engine.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify asset set and checksum
        run: |
          python - <<'PYASSETS'
          from pathlib import Path
          import hashlib
          root=Path('release-assets')
          expected={'XYRO-2.0.0-Android.apk','XYRO-2.0.0-Windows-x64.zip','XYRO-2.0.0-Linux-x64.tar.gz'}
          assert {p.name for p in root.iterdir()}==expected, 'Unexpected or missing release asset'
          lines=[]
          for p in sorted(root.iterdir()):
              assert p.stat().st_size>1000000, 'Truncated release asset'
              lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name)
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PYASSETS
      - name: Publish tested applications
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.engine.outputs.source_sha }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo 'v2.0.0 already exists; published assets are preserved.'
          else
            gh release create v2.0.0 --target "$SOURCE_SHA" --title 'XYRO 2.0.0 — DAST, SSL, Censys и механические агенты' --notes-file docs/release-v2.0.0.md release-assets/*
          fi
