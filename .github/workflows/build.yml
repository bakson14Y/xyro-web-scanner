name: Build and verify XYRO
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_BUILD_JOBS: '2'
concurrency:
  group: xyro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check engine/web/app.js
  desktop:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Rust toolchain
        run: rustup update stable
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: bin/
          key: native-v1-${{ runner.os }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - run: python tools/build_native.py
        if: steps.native-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: bin/
          key: native-v1-${{ runner.os }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - run: python desktop.py --selftest
      - run: python tools/package_desktop.py
      - name: Test packaged Linux application
        if: runner.os == 'Linux'
        run: ./dist/XYRO/XYRO --selftest
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        run: ./dist/XYRO/XYRO.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: XYRO-${{ runner.os }}-x64
          path: dist/XYRO/
          if-no-files-found: error
          retention-days: 30
  android-native:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'ndk;28.2.13676358'
      - run: rustup update stable
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          key: native-v1-android-${{ matrix.abi }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - name: Build Android executables
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python tools/build_native.py --android "${{ matrix.abi }}" --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          key: native-v1-android-${{ matrix.abi }}-${{ hashFiles('tools.lock.json', 'tools/build_native.py') }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: android/app/src/main/jniLibs/${{ matrix.abi }}/
          if-no-files-found: error
  android:
    needs: android-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: native-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: android/app/src/main/jniLibs/x86_64
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: python tools/prepare_android.py
      - run: gradle -p android assembleDebug lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python tools/check_android.py
      - name: Name APK and calculate checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/XYRO-Android-universal-debug.apk
          cd dist
          sha256sum XYRO-Android-universal-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XYRO-Android-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: |
            test-results/
            android/app/build/reports/
          if-no-files-found: ignore
